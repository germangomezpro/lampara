<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Lámpara</title>

<style>
    #boton{
        display: block;
        padding:3px 10px;
        border-radius: 8px;
        border: 2px solid black;
        color: white;
        background-color: darkred;
        cursor:pointer;
    }
</style>
</head>
<body>
    <p id="estado">Cargando...</p>
    <button id="boton">Prender / Apagar</button>

    <script>
        function mostrar(datos) {
            if (datos.encendida == 1) {
                document.getElementById('estado').textContent = 'Prendida';
            } else {
                document.getElementById('estado').textContent = 'Apagada';
            }
        }

        async function cargarEstado() {
            const respuesta = await fetch('estado.php');
            const datos = await respuesta.json();
            mostrar(datos);
        }

        async function cambiarEstado() {
            const respuesta = await fetch('cambiar.php');
            const datos = await respuesta.json();
            mostrar(datos);
        }

        document.getElementById('boton').addEventListener('click', cambiarEstado);

        cargarEstado();
    </script>
</body>
</html>
